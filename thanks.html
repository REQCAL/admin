<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; base-uri 'none'; form-action 'none'">
<title>حالة الدفع</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#12151c;--mu:#6a7282;--bd:#e5e8ee;--pr:#4f6bff;--pr2:#7c5cff;--ok:#16a34a;--er:#dc2626;--sh:0 6px 24px rgba(18,21,28,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#98a1b3;--bd:#232a37;--ok:#4ade80;--er:#f87171;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;font-family:"Tajawal",system-ui,sans-serif;font-weight:500;line-height:1.7;color:var(--tx);background:var(--bg)}
main{max-width:460px;width:100%;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 20px;box-shadow:var(--sh)}
h1{margin:0 0 8px;font-size:1.2rem;font-weight:800}p{margin:0;color:var(--mu)}
.ic{width:48px;height:48px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;font-size:1.6rem;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--pr),var(--pr2))}
</style>
</head>
<body><main><div class="ic" id="ic">✓</div><h1 id="t"></h1><p id="d"></p></main><script src="thanks.js"></script></body>
</html>
