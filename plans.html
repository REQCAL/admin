<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>الباقات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&display=swap">
<style>
:root{--bg:#f4f5f8;--card:#fff;--tx:#12151c;--mu:#6a7282;--bd:#e5e8ee;--in:#f7f8fb;
--pr:#4f6bff;--pr2:#7c5cff;--ok:#16a34a;--er:#dc2626;--wr:#b45309;--sh:0 6px 24px rgba(18,21,28,.06);
--tint:color-mix(in srgb,var(--pr) 12%,transparent);--glow:color-mix(in srgb,var(--pr) 35%,transparent)}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--card:#141821;--tx:#eceef3;--mu:#98a1b3;--bd:#232a37;--in:#0f131b;--ok:#4ade80;--er:#f87171;--wr:#fbbf24;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;padding:20px 16px;font-family:"Tajawal","Inter",system-ui,sans-serif;font-weight:500;line-height:1.65;color:var(--tx);background:var(--bg)}
body.embed{background:transparent;padding:8px}
.wrap{max-width:1100px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin:0 0 18px}
.top img{width:46px;height:46px;border-radius:13px;object-fit:contain;background:var(--card);border:1px solid var(--bd)}
.top h1{margin:0;font-size:1.25rem;font-weight:800}
.top p{margin:0;color:var(--mu);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:stretch}
.plan{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px;box-shadow:var(--sh);min-width:0}
.plan h2{margin:0;font-size:1.1rem;font-weight:800}
.plan .d{margin:0;color:var(--mu);font-size:.88rem}
.price{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px}
.price b{font-size:1.9rem;font-weight:800;line-height:1.2}
.price s{color:var(--mu);font-size:.95rem}
.price span{color:var(--mu);font-size:.88rem}
.off{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:800;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;flex:1}
li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
li.no{color:var(--mu);text-decoration:line-through;text-decoration-color:var(--bd)}
li small{color:var(--mu);font-weight:500}
.ic{width:18px;height:18px;flex:none;margin-top:3px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
li:not(.no) .ic{color:var(--ok)}li.no .ic{color:var(--mu)}
button{width:100%;padding:12px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;font:inherit;font-weight:800;cursor:pointer;box-shadow:0 8px 20px var(--glow);transition:transform .15s}
button:active{transform:scale(.98)}
button:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.load{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:.9rem;justify-content:center;padding:40px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--bd);border-top-color:var(--pr);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:28px 16px;text-align:center;color:var(--mu);box-shadow:var(--sh)}
.msg.bad{color:var(--er)}
.toast{position:fixed;inset-inline:16px;inset-block-end:16px;margin-inline:auto;width:fit-content;max-width:90vw;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:13px;box-shadow:var(--sh);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="load"><span class="spin"></span>جارٍ التحميل…</div></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
 <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/></symbol>
 <symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
</svg>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="plans.js"></script>
</body>
</html>
